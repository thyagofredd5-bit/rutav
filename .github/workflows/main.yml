name: Build RutaViva APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Normalizar carpetas y completar andamiaje Android
        run: |
          set -e
          # 1. Si los archivos se subieron dentro de una subcarpeta (ej. rutaviva_ai/), moverlos a la raiz
          if [ ! -f "pubspec.yaml" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "pubspec.yaml" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moviendo proyecto desde $SUBDIR a la raiz..."
              shopt -s dotglob
              mv "$SUBDIR"/* .
              rmdir "$SUBDIR" || true
            fi
          fi

          # 2. Generar andamiaje base de Android con el paquete exacto com.rutaviva.ai
          flutter create --platforms=android --org com.rutaviva --project-name ai /tmp/scaffold

          # 3. Evitar conflicto entre build.gradle (Groovy) y build.gradle.kts (Kotlin DSL)
          if [ -f "android/app/build.gradle" ]; then
            rm -f /tmp/scaffold/android/app/build.gradle.kts
          fi

          # 4. Copiar archivos base de Gradle e iconos sin sobrescribir los nuestros
          mkdir -p android
          cp -rn /tmp/scaffold/android/. android/ || true

          # 5. Asegurar que MainActivity.kt exista en la ruta correcta
          mkdir -p android/app/src/main/kotlin/com/rutaviva/ai
          if [ ! -f "android/app/src/main/kotlin/com/rutaviva/ai/MainActivity.kt" ]; then
            cat << 'EOF' > android/app/src/main/kotlin/com/rutaviva/ai/MainActivity.kt
          package com.rutaviva.ai

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

          chmod +x android/gradlew
          ls -la
          ls -la android/app/src/main/kotlin/com/rutaviva/ai

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RutaViva-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
