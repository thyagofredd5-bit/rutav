name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repo solo versiona los archivos propios de android/. El andamiaje
      # (gradle wrapper, settings, estilos, iconos) se genera con flutter create
      # y se copia SIN sobrescribir nada de lo ya existente.
      - name: Completar andamiaje Android
        run: |
          set -e
          flutter create --project-name rutaviva_ai --org com.rutaviva --platforms=android /tmp/scaffold
          rsync -a --ignore-existing /tmp/scaffold/android/ android/
          rm -f android/app/build.gradle.kts
          rm -rf android/app/src/main/kotlin/com/rutaviva/rutaviva_ai
          ls android android/app/src/main/kotlin/com/rutaviva/ai

      - name: Dependencias
        run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: rutaviva-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
